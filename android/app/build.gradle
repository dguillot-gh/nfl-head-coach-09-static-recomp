plugins {
    id 'com.android.application'
}

// hc09.ffmpegSource in local.properties: the FFmpeg 8.0 source tree the XMA decoder is built from
// (see android/native/CMakeLists.txt).
def localProperties = new Properties()
if (rootProject.file('local.properties').exists()) {
    rootProject.file('local.properties').withInputStream { localProperties.load(it) }
}
def ffmpegSource = localProperties.getProperty('hc09.ffmpegSource', '')

android {
    namespace = 'com.hc09.recomp'
    compileSdk 35
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId 'com.hc09.recomp'
        // 26: AAudio, ASharedMemory and Vulkan in the NDK; the LG V30 runs Android 8.0.
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DHC09_ANDROID_APP=ON', "-DHC09_FFMPEG_SOURCE=${ffmpegSource}"
                targets 'hc09'
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        debug {
            // The native side is always built optimized: the recompiled game is unplayable at -O0.
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path '../native/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            // Keep the library uncompressed and page-aligned in the APK: faster start, no extraction.
            useLegacyPackaging false
        }
    }

    // The game's shaders as SPIR-V (assets/shaders/<microcode hash>.<vs|ps>.spv), built from the
    // captured microcode by tools/shaders_to_spirv.py into build/shaders-spirv. Derived from the
    // game, so never committed: each local build copies them in.
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/hc09Assets"]
        }
    }
    androidResources {
        noCompress 'spv'
    }

    lint {
        abortOnError false
    }
}

tasks.register('copyShaders', Copy) {
    from "${rootDir}/../build/shaders-spirv"
    include '*.spv'
    into "$buildDir/generated/hc09Assets/shaders"
}
// The pipelines seen while playing (the renderer's pipelines.txt from a phone, copied to build/), which
// the app pre-compiles at start. Also derived from the game: not committed.
tasks.register('copyPipelineList', Copy) {
    from "${rootDir}/../build"
    include 'pipelines.txt'
    into "$buildDir/generated/hc09Assets"
}
preBuild.dependsOn 'copyShaders', 'copyPipelineList'
