plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.hc09.recomp'
    compileSdk 35
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId 'com.hc09.recomp'
        // 26: AAudio, ASharedMemory and Vulkan in the NDK; the LG V30 runs Android 8.0.
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DHC09_ANDROID_APP=ON'
                targets 'hc09'
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        debug {
            // The native side is always built optimized: the recompiled game is unplayable at -O0.
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path '../native/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            // Keep the library uncompressed and page-aligned in the APK: faster start, no extraction.
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
    }
}
