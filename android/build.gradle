// Android app for the HC09 recompilation. Build without gradlew.bat (scripts may be blocked):
//   java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:assembleDebug
// Needs JDK 17 and local.properties with sdk.dir=<Android SDK>.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
